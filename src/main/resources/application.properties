spring.application.name=backpetique
spring.profiles.active=local

spring.datasource.url=jdbc:mysql://localhost:3306/boupetique_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#create-drop solo recomendada para desarrollo
spring.jpa.hibernate.ddl-auto= update
